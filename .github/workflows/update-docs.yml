# Identical in claude-code-docs-skill, codex-docs-skill, and cursor-docs-skill.
# Product settings live in scripts/fetch_docs.py.
name: Update docs mirror

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          check-latest: true
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements-dev.txt

      - name: Run the offline tests
        run: python -m pytest -q

  drift:
    name: Shared files match the sibling repositories
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          check-latest: true
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Compare the shared files
        run: python scripts/fetch_docs.py --check-drift

  update-docs:
    name: Refresh the mirror
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: update-docs
      cancel-in-progress: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          check-latest: true
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements-dev.txt

      - name: Fetch the latest documentation
        run: python scripts/fetch_docs.py

      - name: Validate the refreshed mirror
        run: python -m pytest tests/test_repository.py -q

      - name: Commit and push changes
        run: |
          git add -A skills plugin.json .claude-plugin .cursor-plugin
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi

          changes=$(git diff --cached --no-renames --name-status -- skills)
          count() { printf '%s\n' "$changes" | awk -v status="$1" '$1 == status' | wc -l | tr -d ' '; }
          files() { printf '%s\n' "$changes" | awk -v status="$1" '$1 == status {print $2}'; }
          product=$(python scripts/fetch_docs.py --product-name)
          subject="Update ${product} docs - $(date -u +%Y-%m-%d) (+$(count A) ~$(count M) -$(count D))"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            printf '%s\n' "$subject"
            for status in A M D; do
              list=$(files "$status")
              [ -z "$list" ] && continue
              case "$status" in A) label=Added ;; M) label=Updated ;; D) label=Removed ;; esac
              printf '\n%s:\n%s\n' "$label" "$list"
            done
          } | git commit --quiet -F -

          # Another push can land while the refresh runs; rebase and retry.
          for attempt in 1 2 3; do
            if git push --quiet; then
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebasing onto the latest main."
            if ! git pull --rebase --quiet; then
              git rebase --abort || true
              echo "Rebase conflicted; the next run will retry from a fresh checkout." >&2
              exit 1
            fi
          done
          echo "Could not push after 3 attempts." >&2
          exit 1

  report:
    name: Report scheduled failures
    needs: [test, update-docs]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update, or close the failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULTS: ${{ needs.test.result }} ${{ needs.update-docs.result }}
        with:
          script: |
            const title = 'Docs mirror update failures';
            const failed = process.env.RESULTS.split(' ').some((result) => ['failure', 'cancelled'].includes(result));
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Match on title and author so alerting never depends on a label.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.filter(
              (issue) => !issue.pull_request && issue.title === title && issue.user?.login === 'github-actions[bot]',
            );

            if (failed) {
              const body = `The scheduled refresh failed on ${new Date().toISOString().slice(0, 10)}: ${run}`;
              if (existing.length > 0) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing[0].number, body });
              } else {
                await github.rest.issues.create({ ...context.repo, title, body });
              }
              return;
            }

            for (const issue of existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `Resolved by a successful run: ${run}`,
              });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            }
