name: Update Claude Code Documentation

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: update-docs
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch latest documentation
        run: python scripts/fetch_claude_code_docs.py

      - name: Stage and commit if anything changed
        run: |
          git add -A skills/claude-code-docs/references/
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi

          changed=$(git diff --name-status --cached | awk '$1 == "M" {print $2}' | paste -sd ", " -)
          added=$(git diff --name-status --cached | awk '$1 == "A" {print $2}' | paste -sd ", " -)
          removed=$(git diff --name-status --cached | awk '$1 == "D" {print $2}' | paste -sd ", " -)

          msg="Update Claude Code docs - $(date +'%Y-%m-%d')"
          [ -n "$changed" ] && msg="$msg | Updated: $changed"
          [ -n "$added" ] && msg="$msg | Added: $added"
          [ -n "$removed" ] && msg="$msg | Removed: $removed"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "$msg"
          git push

      - name: Open or update failure issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'docs-fetch-failure';
            const date = new Date().toISOString().split('T')[0];
            const body = `Scheduled Claude Code docs fetch failed on ${date}. See the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              return;
            }

            const labels = [];
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
              labels.push(label);
            } catch (_) {
              // Ignore missing label; create the issue without labels.
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Claude Code documentation update failures',
              body,
              labels,
            });
